volumes:
  redis_data:
  static_volume:
    external: true
  pgdata:

services:
  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    #environment:
      #- POSTGRES_DB=${NAME}
      #- POSTGRES_USER=${USER}
      #- POSTGRES_PASSWORD=${PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data


  redis:
    image: redis:7
    volumes:
      - redis_data:/data  # env_file:
    env_file:
      - ./.env

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis


