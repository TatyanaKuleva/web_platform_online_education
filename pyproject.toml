[tool.poetry]
name = "web-platform-online-education"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
psycopg2-binary = "^2.9.11"
django = "^5.2"
pillow = "^12.0.0"
ipython = "^9.8.0"
python-dotenv = "^1.2.1"
djangorestframework = "^3.16.1"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"
drf-yasg = "^1.21.11"
stripe = "^14.1.0"
celery = "^5.6.2"
eventlet = "^0.40.4"
redis = "^7.1.0"
django-celery-beat = "^2.8.1"
gunicorn = "^24.1.1"
django-redis = "^6.0.0"


[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
flake8 = "^7.3.0"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''(\.git)'''
